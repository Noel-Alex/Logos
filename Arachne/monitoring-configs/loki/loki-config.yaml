auth_enabled: false

server:
  http_listen_port: 3100

ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  # --- ADD THIS BLOCK ---
  # Explicitly configure the WAL directory to be inside /loki
  wal:
    enabled: true
    dir: /loki/wal
  # ----------------------

schema_config:
  configs:
    - from: 2020-05-15
      store: boltdb
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 168h

storage_config:
  boltdb:
    directory: /loki/index
  filesystem:
    directory: /loki/chunks

# This is still required from the previous fix
limits_config:
  allow_structured_metadata: false