networks:
  monitoring-net:
    driver: bridge

volumes:
  kafka_data:
    driver: local
  scylla_data:
    driver: local

services:
  # --- APPLICATION STACK ---
  scylla:
    image: scylladb/scylla:latest
    container_name: scylla
    ports:
      - "9042:9042" # Native CQL port
      # The 9180 port is for Prometheus metrics. We don't need to publish it to the host,
      # as Prometheus will access it over the internal Docker network.
    volumes:
      - scylla_data:/var/lib/scylla
    command:
      - --smp=1
      - --developer-mode=1
      - --memory=4G
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep '^UN'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - monitoring-net

  kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: kafka-broker
    ports:
      - "9093:9093" # External listener
    volumes:
      - kafka_data:/bitnami/kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9094
      - KAFKA_CFG_LISTENERS=INTERNAL://:9092,EXTERNAL://:9093,CONTROLLER://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CLUSTER_ID=mR__5yE4SgGkI-gLmswYNA
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_CFG_NUM_PARTITIONS=3
    networks:
      - monitoring-net

  init-kafka:
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    container_name: init-kafka
    depends_on:
      - kafka
    command: |
      /bin/sh -c "
        echo 'Waiting for Kafka to be ready...'
        until kafka-topics.sh --bootstrap-server kafka:9092 --list; do
          echo 'Kafka not ready yet, sleeping for 2 seconds...'
          sleep 2
        done
        
        echo 'Kafka is up! Creating topics...'
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic urls-to-crawl --partitions 160 --replication-factor 1
        kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic crawl-results --partitions 16 --replication-factor 1
        echo 'Topics created successfully.'
      "
    networks:
      - monitoring-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - init-kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: arachne-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - monitoring-net

  # --- MONITORING STACK ---
  jmx-exporter:
    image: sscaling/jmx-prometheus-exporter
    container_name: jmx-exporter
    command: "5556" # Port the exporter will listen on
    ports:
      - "5556:5556"
    environment:
      # --- THIS IS THE CORRECTED SYNTAX ---
      # Switched to mapping syntax and used a multi-line string for CONFIG_YML
      JMX_PORT: 9997
      JMX_HOST: kafka
      CONFIG_YML: |
        ---
        - pattern: 'kafka.consumer<type=consumer-fetch-manager-metrics, client-id=(.+), topic=(.+), partition=(.+)><>records-lag'
          name: "kafka_consumer_records_lag"
          labels:
            clientId: "$1"
            topic: "$2"
            partition: "$3"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - 9090:9090
    volumes:
      - ./monitoring-configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring-net
    depends_on:
      - alertmanager
      - scylla # Make sure Scylla is healthy before Prometheus starts scraping

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - 9095:9095
    volumes:
      - ./monitoring-configs/alertmanager/config.yml:/etc/alertmanager/config.yml
    networks:
      - monitoring-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - 3100:3100
    volumes:
      - ./monitoring-configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - monitoring-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring-configs/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "472"
    ports:
      - 3000:3000
    volumes:
      - ./monitoring-configs/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=scylladb-scylla-datasource
    networks:
      - monitoring-net
    depends_on:
      - prometheus
      - loki