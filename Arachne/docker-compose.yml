version: '3.8'

networks:
  monitoring-net:
    driver: bridge

volumes:
  redpanda_data:
    driver: local
  scylla_data:
    driver: local

services:
  # --- DATA STORE STACK ---
  scylla:
    image: scylladb/scylla:latest
    container_name: scylla
    ports:
      - "9042:9042" # Native CQL
    volumes:
      - scylla_data:/var/lib/scylla
    command:
      - --smp=1
      - --developer-mode=1
      - --memory=4G
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep '^UN'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - monitoring-net

  # --- STREAMING STACK (REDPANDA) ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda start
      - --smp 1  # Use 1 CPU core
      - --memory 2G # Explicit RAM limit
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAIN://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr PLAIN://redpanda:9092,OUTSIDE://localhost:9093
      - --pandaproxy-addr 0.0.0.0:8082
    ports:
      - "9092:9092"
      - "9093:9093"
      - "8081:8081" # Schema Registry
      - "8082:8082" # HTTP Proxy
      - "9644:9644" # Admin + PROMETHEUS METRICS
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - monitoring-net

  # --- INIT JOB (FIXED SYNTAX) ---
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-init
    depends_on:
      - redpanda
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Waiting for Redpanda Admin API...'
        while ! rpk cluster health -X admin.hosts=redpanda:9644; do sleep 2; done
        
        echo 'Redpanda is up! Creating topics...'
        
        # TOPIC: urls-to-crawl
        # -p 160: High concurrency
        # retention.ms=3600000: Delete data older than 1 hour (safety buffer)
        # retention.bytes=5368709120: Keep max 5GB of backlog total
        # segment.bytes=16777216: Close a log file every 16MB so it can be deleted quickly
        rpk topic create urls-to-crawl -p 160 -r 1 \
          -c retention.ms=3600000 \
          -c retention.bytes=5368709120 \
          -c segment.bytes=16777216 \
          -X brokers=redpanda:9092
        
        # TOPIC: crawl-results
        # Same logic, but maybe we keep results slightly longer (e.g., 4 hours)
        rpk topic create crawl-results -p 16 -r 1 \
          -c retention.ms=14400000 \
          -c max.message.bytes=10485760 \
          -c segment.bytes=67108864 \
          -X brokers=redpanda:9092
        
        echo 'Topics created with Aggressive Retention policies.'
    networks:
      - monitoring-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
    environment:
      KAFKA_CLUSTERS_0_NAME: redpanda-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - monitoring-net

  # --- MONITORING STACK ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - 9090:9090
    volumes:
      - ./monitoring-configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring-net
    depends_on:
      - redpanda
      - scylla

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - 9095:9095
    volumes:
      - ./monitoring-configs/alertmanager/config.yml:/etc/alertmanager/config.yml
    networks:
      - monitoring-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - 3100:3100
    volumes:
      - ./monitoring-configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - monitoring-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring-configs/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "472"
    ports:
      - 3000:3000
    volumes:
      - ./monitoring-configs/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=scylladb-scylla-datasource
    networks:
      - monitoring-net
    depends_on:
      - prometheus
      - loki