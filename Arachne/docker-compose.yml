networks:
  monitoring-net:
    driver: bridge

volumes:
  redpanda_data:
    driver: local
  scylla_data:
    driver: local
  vm_data:
    driver: local
  grafana_data:
    driver: local

services:
  # --- DATA STORE STACK ---
  scylla:
    image: scylladb/scylla:latest
    container_name: scylla
    ports:
      - "9042:9042" # Native CQL
    volumes:
      - scylla_data:/var/lib/scylla
    command:
      - --smp=16
      - --developer-mode=1
      - --memory=16G
      - --cluster-name=arachne-cluster
    healthcheck:
      test: ["CMD-SHELL", "nodetool status | grep '^UN'"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - monitoring-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - monitoring-net

  # --- STREAMING STACK (REDPANDA) ---
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda start
      - --smp 4  # Use 1 CPU core
      - --memory 2G # Explicit RAM limit
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --advertise-kafka-addr PLAIN://redpanda:9092,OUTSIDE://localhost:9093
      - --pandaproxy-addr 0.0.0.0:8082
      - --kafka-addr PLAIN://0.0.0.0:9092,OUTSIDE://0.0.0.0:9093
      - --rpc-addr 0.0.0.0:33145
      # Increase max request size to 20MB globally
      - --set redpanda.kafka_batch_max_bytes=209715200
      - --set redpanda.kafka_max_message_bytes=209715200
      #- --set max.poll.interval.ms=18000000
    ports:
      - "9092:9092"
      - "9093:9093"
      - "8081:8081" # Schema Registry
      - "8082:8082" # HTTP Proxy
      - "9644:9644" # Admin + PROMETHEUS METRICS
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - monitoring-net

  # --- INIT JOB (FIXED SYNTAX) ---
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-init
    depends_on:
      - redpanda
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo 'Waiting for Redpanda Admin API...'
        while ! rpk cluster health -X admin.hosts=redpanda:9644; do sleep 2; done
        
        echo 'Redpanda is up! Creating topics...'
        

        rpk topic create urls-to-crawl -p 160 -r 1 \
          -c retention.ms=604800000 \
          -c segment.bytes=67108864 \
          -X brokers=redpanda:9092
        
        # TOPIC: crawl-results
        rpk topic create crawl-results -p 16 -r 1 \
          -c max.message.bytes=209715200 \
          -c retention.ms=604800000 \
          -X brokers=redpanda:9092
        
        echo 'Topics created with Aggressive Retention policies.'
    networks:
      - monitoring-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
    environment:
      KAFKA_CLUSTERS_0_NAME: redpanda-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - monitoring-net

  # --- MONITORING STACK ---
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    # Reduce local Prometheus retention to 2 days to save space,
    # since long-term data goes to VictoriaMetrics.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=2d'
    ports:
      - 9090:9090
    volumes:
      - ./monitoring-configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring-net
    depends_on:
      - redpanda
      - scylla
      - victoriametrics # Ensure VM is up before Prometheus tries to write to it

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: victoriametrics
    ports:
      - "8428:8428"
    volumes:
      - vm_data:/victoria-metrics-data
    command:
      - "-retentionPeriod=1y" # Keep data for 1 year (adjust as needed: 6m, 2y, etc.)
      - "-storageDataPath=/victoria-metrics-data"
    networks:
      - monitoring-net

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - 9095:9095
    volumes:
      - ./monitoring-configs/alertmanager/config.yml:/etc/alertmanager/config.yml
    networks:
      - monitoring-net

  loki:
    image: grafana/loki:latest
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - 3100:3100
    volumes:
      - ./monitoring-configs/loki/loki-config.yaml:/etc/loki/loki-config.yaml
    networks:
      - monitoring-net

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./monitoring-configs/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitoring-net
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    user: "472"
    ports:
      - 3000:3000
    volumes:
      - ./monitoring-configs/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_PANELS_DISABLE_SANITIZE_HTML=true
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=scylladb-scylla-datasource
    networks:
      - monitoring-net
    depends_on:
      - prometheus
      - loki

  cadvisor:
      image: gcr.io/cadvisor/cadvisor:v0.47.2     # Use a pinned version for stability
      container_name: cadvisor
      restart: unless-stopped
      privileged: true                             # Required to access host metrics
      devices:
        - /dev/kmsg
      volumes:
        - /:/rootfs:ro                             # Read host filesystem
        - /var/run:/var/run:ro                     # Read Docker socket
        - /sys:/sys:ro                             # Read Linux Kernel stats
        - /var/lib/docker/:/var/lib/docker:ro      # Read Docker container storage
        - /dev/disk/:/dev/disk:ro
      ports:
        - "8085:8080"                              # Expose on host port 8081 (8080 is taken by Kafka-UI)
      networks:
        - monitoring-net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok_tunnel
    restart: unless-stopped
    environment:
      # Paste your real token below
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: "http grafana:3000" # Points to the grafana container name and port
    ports:
      - 4040:4040 # Local status dashboard for ngrok
    networks:
      - monitoring-net
    depends_on:
      - grafana
